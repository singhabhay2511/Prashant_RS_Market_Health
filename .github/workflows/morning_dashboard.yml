name: Morning Dashboard

on:
  schedule:
    # 8:30 AM IST = 03:00 UTC  (Mon–Fri only)
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # curl_cffi lets yfinance impersonate a real Chrome browser at TLS level.
          # This is the ONLY reliable way to get Yahoo Finance data from CI runner IPs.
          pip install "curl_cffi>=0.6"
          pip install \
            "yfinance>=0.2.50" \
            pandas \
            numpy \
            "matplotlib>=3.7" \
            Pillow \
            requests \
            requests-cache

      - name: Verify curl_cffi works
        run: python -c "from curl_cffi import requests; print('curl_cffi OK')"

      - name: Generate & send dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python morning_dashboard.py

      - name: Upload PNG artifact (7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-dashboard-${{ github.run_id }}
          path: morning_dashboard_*.png
          retention-days: 7
          if-no-files-found: warn
