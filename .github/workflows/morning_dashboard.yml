name: Morning Dashboard

on:
  schedule:
    # 8:30 AM IST = 03:00 UTC  (Mon–Fri only)
    - cron: '0 3 * * 1-5'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # breadth scan ~10 min + buffer

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            yfinance==0.2.38 \
            pandas \
            numpy \
            matplotlib \
            Pillow \
            requests

      - name: Generate & send dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python morning_dashboard.py

      - name: Upload PNG artifact (7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-dashboard-${{ github.run_id }}
          path: morning_dashboard_*.png
          retention-days: 7
          if-no-files-found: warn
